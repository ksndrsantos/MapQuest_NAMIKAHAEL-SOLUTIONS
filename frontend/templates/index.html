<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MapQuest Route Planner</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <main class="container">

        <header>
            <h1>MapQuest Route Planner</h1>
            <p>Find route information between two locations.</p>
        </header>

        <!-- Route input section -->
        <section class="route-card">

            <form id="route-form">

                <!-- Starting location -->
                <div class="form-group">
                    <label for="origin">
                        Starting Location
                    </label>

                    <input
                        type="text"
                        id="origin"
                        name="origin"
                        placeholder="Enter starting location"
                    >
                </div>

                <!-- Destination -->
                <div class="form-group">
                    <label for="destination">
                        Destination
                    </label>

                    <input
                        type="text"
                        id="destination"
                        name="destination"
                        placeholder="Enter destination"
                    >
                </div>

                <!-- Distance unit -->
                <div class="form-group">
                    <label for="unit">
                        Distance Unit
                    </label>

                    <select id="unit" name="unit">
                        <option value="m">Miles</option>
                        <option value="k">Kilometers</option>
                    </select>
                </div>

                <!-- Submit button -->
                <button type="submit">
                    Find Route
                </button>

            </form>

        </section>

        <!-- Route results will appear here -->
        <section
            id="route-results"
            class="route-results"
        ></section>

    </main>

    <!-- JavaScript for frontend-backend communication -->
    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>
</html>
